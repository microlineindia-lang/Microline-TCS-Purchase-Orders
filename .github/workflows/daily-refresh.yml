name: Daily TCS refresh

# Free replacement for Cloud Scheduler. It wakes the app (free hosts put idle
# apps to sleep) and then asks it to import new Ariba emails.
# 02:30 UTC = 08:00 IST. GitHub may start scheduled runs a few minutes late.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}          # e.g. https://your-app.onrender.com (no trailing slash)
      CRON_TOKEN: ${{ secrets.TCS_CRON_TOKEN }}
    steps:
      - name: Wake the app
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/healthz" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "App did not wake up in time"; exit 1

      - name: Trigger refresh
        run: |
          curl --fail-with-body -sS -X POST --max-time 120 \
            -H "X-Cron-Token: $CRON_TOKEN" \
            "$APP_URL/api/refresh/scheduled"

      # Free hosts sleep an app after ~15 idle minutes, and a background import
      # does not count as traffic. Ping it so it stays awake until the scan ends.
      - name: Keep the app awake while the import runs
        run: |
          for i in $(seq 1 10); do
            sleep 60
            curl -s -o /dev/null --max-time 30 "$APP_URL/healthz" || true
          done
