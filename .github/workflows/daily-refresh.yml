name: Daily TCS refresh

# Free replacement for Cloud Scheduler. It wakes the app (free hosts put idle
# apps to sleep), starts the import, then waits until the import really
# finishes. The run is green only if the import succeeded.
# 02:30 UTC = 08:00 IST. GitHub may start scheduled runs a few minutes late.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_URL_RAW: ${{ secrets.APP_URL }}
      CRON_TOKEN: ${{ secrets.TCS_CRON_TOKEN }}
    steps:
      - name: Wake the app
        run: |
          APP_URL=$(printf '%s' "$APP_URL_RAW" | tr -d '[:space:]')
          APP_URL="${APP_URL%/}"
          echo "Checking $APP_URL/healthz"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/healthz" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "App did not wake up in time"; exit 1

      - name: Start the import and wait for it to finish
        run: |
          APP_URL=$(printf '%s' "$APP_URL_RAW" | tr -d '[:space:]')
          APP_URL="${APP_URL%/}"

          resp=$(curl --fail-with-body -sS -X POST --max-time 120 \
            -H "X-Cron-Token: $CRON_TOKEN" \
            "$APP_URL/api/refresh/scheduled")
          echo "Start response: $resp"

          job_id=$(echo "$resp" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "No new job was started (skipped, see response above)."
            exit 0
          fi

          # Polling every 30 s also keeps a free-tier app from going to sleep.
          for i in $(seq 1 90); do
            sleep 30
            out=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "X-Cron-Token: $CRON_TOKEN" \
              "$APP_URL/api/refresh/scheduled/status?job_id=$job_id" || true)
            code=$(echo "$out" | tail -n1)
            body=$(echo "$out" | sed '$d')
            echo "[$i] HTTP $code $body"

            if [ "$code" = "404" ]; then
              echo "The app restarted and lost the job. Check the Render logs."
              exit 1
            fi

            state=$(echo "$body" | jq -r '.state // empty' 2>/dev/null || true)
            if [ "$state" = "done" ]; then echo "Import finished."; exit 0; fi
            if [ "$state" = "error" ]; then echo "Import FAILED."; exit 1; fi
          done

          echo "Import did not finish within 45 minutes."; exit 1
